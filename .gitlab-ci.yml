stages:
  - check
  - build
  - scan
  - publish

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  MERCURY_CI_IMAGE: mercury:${CI_COMMIT_SHA}

.docker_job:
  image: docker:27.5-cli
  services:
    - name: docker:27.5-dind
  before_script:
    - |
      cat > .env <<'ENVFILE'
      LISTEN_ADDR=0.0.0.0
      LISTEN_PORT=8000
      APP_VERSION=0.4.1
      APP_TITLE=Mercury
      APP_DESCRIPTION=Mercury API
      API_VERSION=v1
      APP_ENV=local
      POSTGRES_HOST=mercury_db
      POSTGRES_PORT=5432
      POSTGRES_DB=mercury
      POSTGRES_USER=mercury
      POSTGRES_PASSWORD=mercury
      REDIS_HOST=mercury_cache
      JWT_SECRET_KEY=local-ci-secret
      JWT_ALGORITHM=HS256
      ENVFILE

lint:
  extends: .docker_job
  stage: check
  script:
    - docker compose --profile test up --build --abort-on-container-exit mercury_linter
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop.*)$/

unit_test:
  extends: .docker_job
  stage: check
  script:
    - docker compose --profile test up --build --abort-on-container-exit mercury_unit_tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop.*)$/

integration_test:
  extends: .docker_job
  stage: check
  script:
    - docker compose --profile test up --build --abort-on-container-exit mercury_integration_tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop.*)$/

security:
  extends: .docker_job
  stage: scan
  script:
    - docker compose --profile test run --build --rm mercury_security
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop.*)$/

image_build:
  extends: .docker_job
  stage: build
  script:
    - docker build --target api --tag "$MERCURY_CI_IMAGE" .
    - docker save "$MERCURY_CI_IMAGE" --output mercury-image.tar
  artifacts:
    paths: [mercury-image.tar]
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop.*)$/

image_scan:
  image: aquasec/trivy:0.69.3
  stage: scan
  needs: [image_build]
  script:
    - trivy image --input mercury-image.tar --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop.*)$/

image_publish:
  extends: .docker_job
  stage: publish
  needs: [lint, unit_test, integration_test, security, image_build, image_scan]
  script:
    - docker load --input mercury-image.tar
    - echo "$DOCKER_HUB_ACCESS_TOKEN" | docker login --username "$DOCKER_HUB_USERNAME" --password-stdin
    - echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
    - docker tag "$MERCURY_CI_IMAGE" ayoub3bidi/mercury:latest
    - docker tag "$MERCURY_CI_IMAGE" "ghcr.io/$GHCR_USERNAME/mercury:latest"
    - docker push ayoub3bidi/mercury:latest
    - docker push "ghcr.io/$GHCR_USERNAME/mercury:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
