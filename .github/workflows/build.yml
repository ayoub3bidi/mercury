name: Build and Publish Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create environment file
        run: |
          cat << 'ENVFILE' > .env
          LISTEN_ADDR=0.0.0.0
          LISTEN_PORT=8000
          APP_VERSION=1.0
          APP_TITLE=Mercury
          APP_DESCRIPTION=Mercury API
          API_VERSION=v1
          APP_ENV=local
          POSTGRES_HOST=mercury_db
          POSTGRES_PORT=5432
          POSTGRES_DB=mercury
          POSTGRES_USER=mercury
          POSTGRES_PASSWORD=mercury
          REDIS_HOST=mercury_cache
          JWT_SECRET_KEY=local-ci-secret
          JWT_ALGORITHM=HS256
          ENVFILE
      - name: Run unit tests
        run: docker compose --profile test run --build --rm mercury_unit_tests
      - name: Run integration tests
        run: docker compose --profile test run --build --rm mercury_integration_tests
      - name: Run lint
        run: docker compose --profile test run --build --rm mercury_linter
      - name: Run Bandit
        run: docker compose --profile test run --build --rm mercury_security
      - name: Run agent runtime and migration E2E
        run: ./ci/agent-e2e.sh

  build-publish:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          tags: |
            ayoub3bidi/mercury:latest
            ghcr.io/${{ github.repository_owner }}/mercury:latest
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ayoub3bidi/mercury:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned images
        run: |
          docker push ayoub3bidi/mercury:latest
          docker push ghcr.io/${{ github.repository_owner }}/mercury:latest
