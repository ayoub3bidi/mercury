name: Security and Image Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create local CI environment
        run: |
          cat > .env <<'ENVFILE'
          LISTEN_ADDR=0.0.0.0
          APP_TITLE=Mercury
          APP_DESCRIPTION=Mercury API
          APP_ENV=local
          POSTGRES_HOST=mercury_db
          POSTGRES_PORT=5432
          POSTGRES_USER=mercury
          POSTGRES_PASSWORD=mercury
          POSTGRES_DB=mercury
          REDIS_HOST=mercury_cache
          JWT_SECRET_KEY=local-ci-secret
          ENVFILE
      - name: Run unit tests
        run: docker compose --profile test run --build --rm mercury_unit_tests
      - name: Run integration tests
        run: docker compose --profile test run --build --rm mercury_integration_tests
      - name: Run lint
        run: docker compose --profile test run --build --rm mercury_linter
      - name: Run Bandit
        run: docker compose --profile test run --build --rm mercury_security
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create local CI environment
        run: |
          cat > .env <<'ENVFILE'
          LISTEN_ADDR=0.0.0.0
          APP_TITLE=Mercury
          APP_DESCRIPTION=Mercury API
          APP_ENV=local
          POSTGRES_HOST=mercury_db
          POSTGRES_PORT=5432
          POSTGRES_USER=mercury
          POSTGRES_PASSWORD=mercury
          POSTGRES_DB=mercury
          REDIS_HOST=mercury_cache
          JWT_SECRET_KEY=local-ci-secret
          ENVFILE
      - name: Build API image
        run: docker build --target api --tag mercury:ci .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: mercury:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Run Bandit
        run: docker compose --profile test run --build --rm mercury_security
